<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MulchMusic — Logo Lab</title>
<style>
  body{margin:0;background:#0a0612;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:monospace;color:#d8c8ff;padding:20px}
  canvas{max-width:100vw;display:block;background:#0a0612;border:1px solid #2a1a3a}
  .row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;justify-content:center}
  button{background:#1a0e2a;color:#d8c8ff;border:1px solid #4a2a6a;padding:8px 14px;font-family:monospace;cursor:pointer;font-size:12px}
  button:hover{background:#2a1a3a}
  button.active{background:#6a2a8a;border-color:#d8c8ff}
  h1{font-size:14px;margin:0;letter-spacing:4px;opacity:0.6}
</style>
</head>
<body>
<h1>MULCHMUSIC // LOGO LAB</h1>
<canvas id="c" width="900" height="500"></canvas>
<div class="row" id="palettes"></div>
<div class="row" id="textures"></div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = c.width, H = c.height, CX = W/2, CY = H/2;

// Triadic palettes — dominant / support / accent
const PALETTES = {
  'COPPER':    {bg:'#0a0612', d:'#ff2a6d', s:'#05d9e8', a:'#f9f871', name:'Amiga Copper'},
  'GARDEN':    {bg:'#0d1a0d', d:'#d6357f', s:'#f5d72e', a:'#7affd4', name:'Mulch Garden'},
  'OILSPILL':  {bg:'#000000', d:'#7c2ad6', s:'#2ad6c7', a:'#ff8a3d', name:'Oil Spill'},
  'IRIDIUM':   {bg:'#0f0a1f', d:'#ff61c9', s:'#61ffe0', a:'#ffe761', name:'Iridium'},
  'TERMINAL':  {bg:'#001a0a', d:'#39ff14', s:'#ff006e', a:'#ffe600', name:'Terminal'},
  'SUNSET':    {bg:'#1a0822', d:'#ff5e7a', s:'#3d5eff', a:'#ffb84d', name:'Sunset'}
};
let palette = PALETTES['GARDEN'];

const TEXTURES = ['SCANLINES','CHECKER','NOISE','DOTS','STRIPES','PLASMA'];
let texture = 'SCANLINES';

// Build palette buttons
const palRow = document.getElementById('palettes');
Object.entries(PALETTES).forEach(([k,v])=>{
  const b = document.createElement('button');
  b.textContent = v.name;
  b.onclick = ()=>{
    palette = v;
    [...palRow.children].forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  };
  if(k==='GARDEN') b.classList.add('active');
  palRow.appendChild(b);
});

// Build texture buttons
const texRow = document.getElementById('textures');
TEXTURES.forEach(t=>{
  const b = document.createElement('button');
  b.textContent = t;
  b.onclick = ()=>{
    texture = t;
    [...texRow.children].forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  };
  if(t==='SCANLINES') b.classList.add('active');
  texRow.appendChild(b);
});

// Build elongated M as Path2D — wider than tall, brutal sans-serif slab
function buildM(cx, cy, w, h){
  const p = new Path2D();
  const stroke = h*0.32;
  const valley = h*0.45;
  const x0 = cx-w/2, x1 = cx+w/2, y0 = cy-h/2, y1 = cy+h/2;
  p.moveTo(x0, y1);
  p.lineTo(x0, y0);
  p.lineTo(x0+stroke*1.1, y0);
  p.lineTo(cx, y0+valley);
  p.lineTo(x1-stroke*1.1, y0);
  p.lineTo(x1, y0);
  p.lineTo(x1, y1);
  p.lineTo(x1-stroke, y1);
  p.lineTo(x1-stroke, y0+valley+stroke*0.9);
  p.lineTo(cx, y0+valley+stroke*1.3);
  p.lineTo(x0+stroke, y0+valley+stroke*0.9);
  p.lineTo(x0+stroke, y1);
  p.closePath();
  return p;
}

// Pre-render texture tiles once
function makeTextureCanvas(kind, size, pal){
  const tc = document.createElement('canvas');
  tc.width = tc.height = size;
  const tx = tc.getContext('2d');
  switch(kind){
    case 'SCANLINES':
      for(let y=0;y<size;y+=2){
        tx.fillStyle = y%4===0 ? pal.d : pal.s;
        tx.fillRect(0,y,size,1);
      }
      break;
    case 'CHECKER':
      for(let y=0;y<size;y+=8) for(let x=0;x<size;x+=8){
        tx.fillStyle = ((x+y)/8)%2===0 ? pal.d : pal.a;
        tx.fillRect(x,y,8,8);
      }
      break;
    case 'NOISE':
      const id = tx.createImageData(size,size);
      for(let i=0;i<id.data.length;i+=4){
        const v = Math.random();
        const col = v<0.33?pal.d:v<0.66?pal.s:pal.a;
        const r = parseInt(col.slice(1,3),16);
        const g = parseInt(col.slice(3,5),16);
        const bl= parseInt(col.slice(5,7),16);
        id.data[i]=r; id.data[i+1]=g; id.data[i+2]=bl; id.data[i+3]=255;
      }
      tx.putImageData(id,0,0);
      break;
    case 'DOTS':
      tx.fillStyle = pal.d; tx.fillRect(0,0,size,size);
      tx.fillStyle = pal.a;
      for(let y=4;y<size;y+=10) for(let x=4;x<size;x+=10){
        tx.beginPath(); tx.arc(x,y,2,0,Math.PI*2); tx.fill();
      }
      break;
    case 'STRIPES':
      for(let x=0;x<size;x+=6){
        tx.fillStyle = (x/6)%2===0 ? pal.d : pal.s;
        tx.fillRect(x,0,6,size);
      }
      break;
    case 'PLASMA':
      const id2 = tx.createImageData(size,size);
      for(let y=0;y<size;y++) for(let x=0;x<size;x++){
        const v = (Math.sin(x*0.08)+Math.sin(y*0.08)+Math.sin((x+y)*0.05))/3;
        const t = (v+1)/2;
        const col = t<0.5?pal.d:pal.s;
        const r = parseInt(col.slice(1,3),16);
        const g = parseInt(col.slice(3,5),16);
        const bl= parseInt(col.slice(5,7),16);
        const idx = (y*size+x)*4;
        id2.data[idx]=r; id2.data[idx+1]=g; id2.data[idx+2]=bl; id2.data[idx+3]=255;
      }
      tx.putImageData(id2,0,0);
      break;
  }
  return tc;
}

// Cache textures per palette+kind
const texCache = new Map();
function getTexture(kind, pal){
  const key = kind+'|'+pal.d+pal.s+pal.a;
  if(!texCache.has(key)) texCache.set(key, makeTextureCanvas(kind, 128, pal));
  return texCache.get(key);
}

// Iridescent gradient stroke — phase animates
function iridStroke(path, t, baseWidth, pal){
  const offset = (t/1000) % 1;
  const grad = ctx.createLinearGradient(-300,0,300,0);
  // Cycle through palette + white highlight
  const stops = [pal.d, pal.s, pal.a, '#ffffff', pal.d];
  for(let i=0;i<stops.length;i++){
    let pos = (i/(stops.length-1) + offset) % 1;
    grad.addColorStop(pos, stops[i]);
  }
  ctx.strokeStyle = grad;
  ctx.lineWidth = baseWidth;
  ctx.stroke(path);
}

function frame(now){
  const t = now;

  // Background with copper-bar drift
  ctx.fillStyle = palette.bg;
  ctx.fillRect(0,0,W,H);

  // Demoscene copper bars — horizontal hue gradient strips
  ctx.save();
  ctx.globalAlpha = 0.18;
  for(let i=0;i<6;i++){
    const y = ((t/30 + i*80) % (H+160)) - 80;
    const grad = ctx.createLinearGradient(0,y,0,y+60);
    grad.addColorStop(0,'transparent');
    grad.addColorStop(0.5, i%2===0?palette.d:palette.s);
    grad.addColorStop(1,'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0,y,W,60);
  }
  ctx.restore();

  // Starfield parallax — tiny demoscene touch
  ctx.fillStyle = palette.a;
  for(let i=0;i<40;i++){
    const sx = (i*97 + t*0.05) % W;
    const sy = (i*53) % H;
    ctx.globalAlpha = 0.3 + (i%3)*0.2;
    ctx.fillRect(sx, sy, 1, 1);
  }
  ctx.globalAlpha = 1;

  // === LAYER STACK ===
  // M dimensions — elongated, wider than tall
  const mW = 600, mH = 220;

  // Drift offsets (slight relative motion)
  const dxM   = Math.sin(t/2200)*4;
  const dyM   = Math.cos(t/1900)*3;
  const dxRect= Math.sin(t/1700+1)*6;
  const dyRect= Math.cos(t/2400+1)*4;
  const dxScr = Math.sin(t/1300+2)*8;
  const dyScr = Math.cos(t/1500+2)*5;

  // SHADOW M (offset, dark accent)
  const shadowM = buildM(CX+12+dxM, CY+12+dyM, mW, mH);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fill(shadowM);
  ctx.restore();

  // BACK ECHO M — chromatic aberration shift
  const echoM = buildM(CX-6+dxM*0.5, CY+dyM*0.5, mW, mH);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = palette.s;
  ctx.fill(echoM);
  ctx.restore();

  // MAIN M — texture filled
  const mainM = buildM(CX+dxM, CY+dyM, mW, mH);
  ctx.save();
  ctx.fillStyle = palette.d;
  ctx.fill(mainM);

  // Texture overlay clipped to M
  ctx.clip(mainM);
  const tex = getTexture(texture, palette);
  const pat = ctx.createPattern(tex, 'repeat');
  ctx.globalAlpha = 0.55;
  // Animate texture by translating before fill
  ctx.translate((t*0.04)%128, (t*0.02)%128);
  ctx.fillStyle = pat;
  ctx.fillRect(-128, -128, W+256, H+256);
  ctx.restore();

  // Iridescent stroke on M
  ctx.save();
  iridStroke(mainM, t, 4, palette);
  // Inner highlight
  ctx.globalCompositeOperation = 'lighter';
  iridStroke(mainM, t*1.7, 1.5, palette);
  ctx.restore();

  // RECTANGULAR INSET — sits in M's center crossbar zone
  const rectW = 320, rectH = 70;
  const rx = CX - rectW/2 + dxRect;
  const ry = CY - rectH/2 + dyRect;

  // Rect shadow
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(rx+5, ry+5, rectW, rectH);

  // Rect fill — yellow accent
  ctx.fillStyle = palette.a;
  ctx.fillRect(rx, ry, rectW, rectH);

  // Rect inner texture stripes
  ctx.save();
  ctx.beginPath();
  ctx.rect(rx, ry, rectW, rectH);
  ctx.clip();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = palette.d;
  for(let x=-rectH;x<rectW+rectH;x+=12){
    ctx.beginPath();
    ctx.moveTo(rx+x+(t*0.05)%24, ry);
    ctx.lineTo(rx+x+rectH+(t*0.05)%24, ry+rectH);
    ctx.lineTo(rx+x+rectH+6+(t*0.05)%24, ry+rectH);
    ctx.lineTo(rx+x+6+(t*0.05)%24, ry);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Rect iridescent border
  ctx.save();
  const rectPath = new Path2D();
  rectPath.rect(rx, ry, rectW, rectH);
  iridStroke(rectPath, t*0.8, 2, palette);
  ctx.restore();

  // CURSIVE WORDMARK — drift independent of rect
  ctx.save();
  ctx.translate(CX+dxScr, CY+dyScr);
  ctx.font = 'italic bold 44px "Brush Script MT","Lucida Handwriting",cursive';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Chromatic split shadow
  ctx.fillStyle = palette.d;
  ctx.fillText('MulchMusic', -2, 2);
  ctx.fillStyle = palette.s;
  ctx.fillText('MulchMusic', 2, -2);

  // Main text
  ctx.fillStyle = palette.bg;
  ctx.fillText('MulchMusic', 0, 0);

  // Iridescent stroke pass on text
  ctx.lineWidth = 1;
  const txtGrad = ctx.createLinearGradient(-150,0,150,0);
  const off = (t/800)%1;
  txtGrad.addColorStop((0+off)%1, palette.a);
  txtGrad.addColorStop((0.5+off)%1, '#ffffff');
  txtGrad.addColorStop((0.99+off)%1, palette.a);
  ctx.strokeStyle = txtGrad;
  ctx.strokeText('MulchMusic', 0, 0);
  ctx.restore();

  // Maple leaf accent — small, top right of rect
  ctx.save();
  ctx.translate(rx+rectW-18+dxScr*0.7, ry+12+dyScr*0.7);
  ctx.scale(0.5, 0.5);
  ctx.fillStyle = palette.d;
  ctx.beginPath();
  ctx.moveTo(0,-12); ctx.lineTo(3,-4); ctx.lineTo(10,-6);
  ctx.lineTo(6,2); ctx.lineTo(12,6); ctx.lineTo(4,7);
  ctx.lineTo(5,14); ctx.lineTo(0,10); ctx.lineTo(-5,14);
  ctx.lineTo(-4,7); ctx.lineTo(-12,6); ctx.lineTo(-6,2);
  ctx.lineTo(-10,-6); ctx.lineTo(-3,-4); ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Scanline overlay full screen — CRT vibe
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#000';
  for(let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);
  ctx.restore();

  // Vignette
  const vg = ctx.createRadialGradient(CX,CY,Math.min(W,H)*0.3, CX,CY,Math.max(W,H)*0.7);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
